# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█

# See https://wiki.hyprland.org/Configuring/Window-Rules/
# Updated for Hyprland 0.53+ syntax

# Opacity rules for browsers
windowrule = opacity 0.90 0.90, match:class ^(firefox)$
windowrule = opacity 0.90 0.90, match:class ^(Google-chrome)$
windowrule = opacity 0.90 0.90, match:class ^(Brave-browser)$

# Opacity rules for code editors
windowrule = opacity 0.80 0.80, match:class ^(code-oss)$
windowrule = opacity 0.80 0.80, match:class ^([Cc]ode)$
windowrule = opacity 0.80 0.80, match:class ^(code-url-handler)$
windowrule = opacity 0.80 0.80, match:class ^(code-insiders-url-handler)$

# Opacity rules for terminals and file managers
windowrule = opacity 0.80 0.80, match:class ^(kitty)$
windowrule = opacity 0.80 0.80, match:class ^(org.kde.dolphin)$
windowrule = opacity 0.80 0.80, match:class ^(org.kde.ark)$

# Opacity rules for settings apps
windowrule = opacity 0.80 0.80, match:class ^(nwg-look)$
windowrule = opacity 0.80 0.80, match:class ^(qt5ct)$
windowrule = opacity 0.80 0.80, match:class ^(qt6ct)$
windowrule = opacity 0.80 0.80, match:class ^(kvantummanager)$

# Opacity rules for system utilities
windowrule = opacity 0.80 0.70, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = opacity 0.80 0.70, match:class ^(blueman-manager)$
windowrule = opacity 0.80 0.70, match:class ^(nm-applet)$
windowrule = opacity 0.80 0.70, match:class ^(nm-connection-editor)$
windowrule = opacity 0.80 0.70, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = opacity 0.80 0.70, match:class ^(polkit-gnome-authentication-agent-1)$
windowrule = opacity 0.80 0.70, match:class ^(org.freedesktop.impl.portal.desktop.gtk)$
windowrule = opacity 0.80 0.70, match:class ^(org.freedesktop.impl.portal.desktop.hyprland)$

# Opacity rules for Steam and Spotify
windowrule = opacity 0.70 0.70, match:class ^([Ss]team)$
windowrule = opacity 0.70 0.70, match:class ^(steamwebhelper)$
windowrule = opacity 0.70 0.70, match:class ^([Ss]potify)$
windowrule = opacity 0.70 0.70, match:title ^(Spotify Free)$
windowrule = opacity 0.70 0.70, match:title ^(Spotify Premium)$

# Opacity rules for various apps
windowrule = opacity 0.90 0.90, match:class ^(com.github.rafostar.Clapper)$
windowrule = opacity 0.80 0.80, match:class ^(com.github.tchx84.Flatseal)$
windowrule = opacity 0.80 0.80, match:class ^(hu.kramo.Cartridges)$
windowrule = opacity 0.80 0.80, match:class ^(com.obsproject.Studio)$
windowrule = opacity 0.80 0.80, match:class ^(gnome-boxes)$
windowrule = opacity 0.80 0.80, match:class ^(vesktop)$
windowrule = opacity 0.80 0.80, match:class ^(discord)$
windowrule = opacity 0.80 0.80, match:class ^(WebCord)$
windowrule = opacity 0.80 0.80, match:class ^(ArmCord)$
windowrule = opacity 0.80 0.80, match:class ^(app.drey.Warp)$
windowrule = opacity 0.80 0.80, match:class ^(net.davidotek.pupgui2)$
windowrule = opacity 0.80 0.80, match:class ^(yad)$
windowrule = opacity 0.80 0.80, match:class ^(Signal)$
windowrule = opacity 0.80 0.80, match:class ^(io.github.alainm23.planify)$
windowrule = opacity 0.80 0.80, match:class ^(io.gitlab.theevilskeleton.Upscaler)$
windowrule = opacity 0.80 0.80, match:class ^(com.github.unrud.VideoDownloader)$
windowrule = opacity 0.80 0.80, match:class ^(io.gitlab.adhami3310.Impression)$
windowrule = opacity 0.80 0.80, match:class ^(io.missioncenter.MissionCenter)$
windowrule = opacity 0.80 0.80, match:class ^(io.github.flattool.Warehouse)$

# Float rules for dolphin dialogs
windowrule = float on, match:class ^(org.kde.dolphin)$ match:title ^(Progress Dialog — Dolphin)$
windowrule = float on, match:class ^(org.kde.dolphin)$ match:title ^(Copying — Dolphin)$

# Float rules for firefox
windowrule = float on, match:title ^(About Mozilla Firefox)$
windowrule = float on, match:class ^(firefox)$ match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(firefox)$ match:title ^(Library)$

# Float rules for terminal apps
windowrule = float on, match:class ^(kitty)$ match:title ^(top)$
windowrule = float on, match:class ^(kitty)$ match:title ^(btop)$
windowrule = float on, match:class ^(kitty)$ match:title ^(htop)$

# Float rules for various applications
windowrule = float on, match:class ^(vlc)$
windowrule = float on, match:class ^(kvantummanager)$
windowrule = float on, match:class ^(qt5ct)$
windowrule = float on, match:class ^(qt6ct)$
windowrule = float on, match:class ^(nwg-look)$
windowrule = float on, match:class ^(org.kde.ark)$
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(nm-applet)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(org.kde.polkit-kde-authentication-agent-1)$

# Float rules for GTK apps
windowrule = float on, match:class ^(Signal)$
windowrule = float on, match:class ^(com.github.rafostar.Clapper)$
windowrule = float on, match:class ^(app.drey.Warp)$
windowrule = float on, match:class ^(net.davidotek.pupgui2)$
windowrule = float on, match:class ^(yad)$
windowrule = float on, match:class ^(eog)$
windowrule = float on, match:class ^(io.github.alainm23.planify)$
windowrule = float on, match:class ^(io.gitlab.theevilskeleton.Upscaler)$
windowrule = float on, match:class ^(com.github.unrud.VideoDownloader)$
windowrule = float on, match:class ^(io.gitlab.adhami3310.Impression)$
windowrule = float on, match:class ^(io.missioncenter.MissionCenter)$

# Common modals
windowrule = float on, match:title ^(Open)$
windowrule = float on, match:title ^(Choose Files)$
windowrule = float on, match:title ^(Save As)$
windowrule = float on, match:title ^(Confirm to replace files)$
windowrule = float on, match:title ^(File Operation Progress)$
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$

# Screenshot tools rules
windowrule = no_focus on, match:class ^(grimblast)$
windowrule = no_focus on, match:class ^(grim)$
windowrule = no_focus on, match:class ^(slurp)$
windowrule = float on, match:class ^(grimblast)$
windowrule = float on, match:class ^(grim)$
windowrule = float on, match:class ^(slurp)$
windowrule = stay_focused on, match:class ^(slurp)$

# Notification rules for dunst
windowrule = float on, match:class ^(dunst)$
windowrule = border_size 0, match:class ^(dunst)$
windowrule = no_focus on, match:class ^(dunst)$

# █░░ ▄▀█ █▄█ █▀▀ █▀█   █▀█ █░█ █░░ █▀▀ █▀
# █▄▄ █▀█ ░█░ ██▄ █▀▄   █▀▄ █▄█ █▄▄ ██▄ ▄█

# vscode blur and opacity
windowrule = opacity 0.95 override, match:class ^(code)$
windowrule = no_blur on, match:class ^(code)$

# swaync notification center
windowrule = float on, match:class (swaync-notification-window)
windowrule = float on, match:class (swaync-control-center)
windowrule = border_size 0, match:class (swaync-notification-window)
windowrule = border_size 0, match:class (swaync-control-center)
windowrule = no_focus on, match:class (swaync-notification-window)
windowrule = opacity 0.95, match:class (swaync-control-center)

# Layer rules
layerrule = blur 1, match:namespace ^(rofi)$
layerrule = ignore_alpha 0, match:namespace ^(rofi)$
layerrule = blur 1, match:namespace ^(notifications)$
layerrule = ignore_alpha 0, match:namespace ^(notifications)$
layerrule = blur 1, match:namespace ^(swaync-notification-window)$
layerrule = ignore_alpha 0, match:namespace ^(swaync-notification-window)$
layerrule = blur 1, match:namespace ^(swaync-control-center)$
layerrule = ignore_alpha 0, match:namespace ^(swaync-control-center)$
layerrule = blur 1, match:namespace ^(logout_dialog)$
