####################
#### ROFI BLUR ####
####################
layerrule = blur, rofi

####################
#### SCRATCHPAD ####
####################
$scratchpad = class:^(.*scratchpad)$
windowrule = $scratchpad, float
windowrule = $scratchpad, size 90% 90%
windowrule = $scratchpad, center
windowrule = $scratchpad, workspace special silent

#################
#### CHATGPT ####
#################
$chatgpt = title:(.*chatgpt.com.*)
windowrule = $chatgpt, float
windowrule = $chatgpt, size 50% 50%
windowrule = $chatgpt, move 12 40

#####################
#### PAVUCONTROL ####
#####################
$pavucontrol = class:(org.pulseaudio.pavucontrol)
windowrule = $pavucontrol, float
windowrule = $pavucontrol, size 40% 40%
windowrule = $pavucontrol, move 55% 40
