# See https://wiki.hyprland.org/Configuring/Keywords/
#  &  https://wiki.hyprland.org/Configuri# notification center keybinds (dunst)
bind = $mainMod, N, exec, dunstctl history-pop  # Show notification history
bind = $mainMod SHIFT, N, exec, dunstctl close-all  # Close all notifications
bind = $mainMod CTRL, N, exec, dunstctl set-paused toggle  # Toggle do not disturb
bind = $mainMod ALT, N, exec, dunstctl context  # Show notification context menu

# Quick notification actions
bind = $mainMod, comma, exec, swaync-client -cp  # Close latest notification
bind = $mainMod SHIFT, comma, exec, swaync-client -C  # Clear all notifications

# Main modifier
$mainMod = Super # super / meta / windows key

# Assign apps
$term = kitty
$editor = code
$file = dolphin
$browser = brave

# Window/Session actions
bindd = $mainMod+Shift, P,Color Picker , exec, hyprpicker -a # Pick color (Hex) >> clipboard#
bind = $mainMod, Q, exec, $scrPath/dontkillsteam.sh # close focused window
bind = Alt, F4, exec, $scrPath/dontkillsteam.sh # close focused window
bind = $mainMod, Delete, exit, # kill hyprland session
bind = $mainMod, W, togglefloating, # toggle the window between focus and float
bind = $mainMod, G, togglegroup, # toggle the window between focus and group
bind = Alt, Return, fullscreen, # toggle the window between focus and fullscreen
bind = $mainMod, L, exec, dms ipc call lock lock # launch lock screen
bind = $mainMod+Shift, F, exec, $scrPath/windowpin.sh # toggle pin on focused window
bind = $mainMod, Backspace, exec, dms ipc call powermenu toggle # launch power menu
bind = Ctrl+Alt, W, exec, dms ipc call bar toggle id default # toggle Dux bar
bind = $mainMod+Ctrl, T, exec, dms ipc call control-center toggle # toggle control center
bind = $mainMod+Ctrl, S, exec, bash $scrPath/hypr-session.sh save # save curated session
bind = $mainMod+Ctrl, R, exec, bash $scrPath/hypr-session.sh restore # restore curated session
bind = $mainMod+Ctrl+Shift, S, exec, bash $scrPath/hypr-session.sh gui # open session restore gui
bind = $mainMod+Ctrl+Shift, D, exec, bash $scrPath/dotfiles-sync.sh gui # open safe dotfiles sync gui

# Application shortcuts
bind = $mainMod, T, exec, $term # launch terminal emulator
bind = $mainMod, E, exec, $file # launch file manager
bind = $mainMod, C, exec, $editor # launch text editor
bind = $mainMod, F, exec, $browser # launch web browser
bind = Ctrl+Shift, Escape, exec, dms ipc call processlist toggle # launch system monitor
# Open obsidian
bind = $mainMod, O, exec, obsidian

# Rofi menus
bind = $mainMod, A, exec, dms ipc call spotlight toggle # launch application launcher
bind = $mainMod, Tab, exec, pkill -x rofi || $scrPath/rofilaunch.sh w # launch window switcher
bind = $mainMod+Shift, E, exec, pkill -x rofi || $scrPath/rofilaunch.sh f # launch file explorer

# Audio control
bindl  = , F10, exec, dms ipc call audio mute # toggle audio mute
bindel = , F11, exec, dms ipc call audio decrement 5 # decrease volume
bindel = , F12, exec, dms ipc call audio increment 5 # increase volume
bindl  = , XF86AudioMute, exec, dms ipc call audio mute # toggle audio mute
bindl  = , XF86AudioMicMute, exec, dms ipc call audio micmute # toggle microphone mute
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 5 # decrease volume
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 5 # increase volume

# Media control
bindl  = , XF86AudioPlay, exec, playerctl play-pause # toggle between media play and pause
bindl  = , XF86AudioPause, exec, playerctl play-pause # toggle between media play and pause
bindl  = , XF86AudioNext, exec, playerctl next # media next
bindl  = , XF86AudioPrev, exec, playerctl previous # media previous

# Brightness control
bindel = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5 '' # increase brightness
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 '' # decrease brightness

# Move between grouped windows
bind = $mainMod CTRL , H, changegroupactive, b
bind = $mainMod CTRL , L, changegroupactive, f

# Screenshot/Screencapture
bind = $mainMod, P, exec, dms ipc call quickCapture screenshot region edit # partial screenshot capture
bind = $mainMod+Ctrl, P, exec, dms ipc call quickCapture screenshot region edit # partial screenshot capture
bind = $mainMod+Alt, P, exec, dms ipc call quickCapture screenshot full edit # monitor screenshot capture
bind = , Print, exec, dms ipc call quickCapture screenshot region edit # partial screenshot capture
bind = SHIFT, Print, exec, dms ipc call quickCapture screenshot full edit # monitor screenshot capture
bind = CTRL, Print, exec, dms ipc call quickCapture fromClipboard edit # annotate clipboard image

# Custom scripts
bind = $mainMod+Alt, G, exec, $scrPath/gamemode.sh # disable hypr effects for gamemode
# bind = $mainMod+Alt, Right, exec, $scrPath/swwwallpaper.sh -n # next wallpaper
# bind = $mainMod+Alt, Left, exec, $scrPath/swwwallpaper.sh -p # previous wallpaper
# bind = $mainMod+Alt, Up, exec, $scrPath/wbarconfgen.sh n # next waybar mode
# bind = $mainMod+Alt, Down, exec, $scrPath/wbarconfgen.sh p # previous waybar mode
bind = $mainMod+Shift, R, exec, pkill -x rofi || $scrPath/wallbashtoggle.sh -m # launch wallbash mode select menu
bind = $mainMod+Shift, T, exec, dms ipc call settings toggleWith personalization # launch theme settings
bind = $mainMod+Shift, A, exec, pkill -x rofi || $scrPath/rofiselect.sh # launch select menu
bind = $mainMod+Shift, W, exec, dms ipc call dash toggle wallpaper # launch wallpaper select menu
# bind = $mainMod, V, exec, pkill -x rofi || $scrPath/cliphist.sh c # launch clipboard
# bind = $mainMod+Shift, V, exec, pkill -x rofi || $scrPath/cliphist.sh # launch clipboard Manager

bind = $mainMod, V, exec, dms ipc call clipboard toggle # open clipboard history
bind = $mainMod+Shift, V, exec, copyq menu

bind = $mainMod, K, exec, $scrPath/keyboardswitch.sh # switch keyboard layout
bind = $mainMod, slash, exec, pkill -x rofi || $scrPath/keybinds_hint.sh c # launch keybinds hint

# Move/Change window focus
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d
bind = Alt, Tab, movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Switch workspaces to a relative workspace
bind = $mainMod+Ctrl, Right, workspace, r+1
bind = $mainMod+Ctrl, Left, workspace, r-1

# Move to the first empty workspace
bind = $mainMod+Ctrl, Down, workspace, empty

# Resize windows
binde = $mainMod+Shift, Right, resizeactive, 30 0
binde = $mainMod+Shift, Left, resizeactive, -30 0
binde = $mainMod+Shift, Up, resizeactive, 0 -30
binde = $mainMod+Shift, Down, resizeactive, 0 30

# Move focused window to a workspace
bind = $mainMod+Shift, 1, movetoworkspace, 1
bind = $mainMod+Shift, 2, movetoworkspace, 2
bind = $mainMod+Shift, 3, movetoworkspace, 3
bind = $mainMod+Shift, 4, movetoworkspace, 4
bind = $mainMod+Shift, 5, movetoworkspace, 5
bind = $mainMod+Shift, 6, movetoworkspace, 6
bind = $mainMod+Shift, 7, movetoworkspace, 7
bind = $mainMod+Shift, 8, movetoworkspace, 8
bind = $mainMod+Shift, 9, movetoworkspace, 9
bind = $mainMod+Shift, 0, movetoworkspace, 10

# Move focused window to a relative workspace
bind = $mainMod+Ctrl+Alt, Right, movetoworkspace, r+1
bind = $mainMod+Ctrl+Alt, Left, movetoworkspace, r-1

# Move active window around current workspace with mainMod + SHIFT + CTRL [←→↑↓]
$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
binded = $mainMod SHIFT $CONTROL, left,Move activewindow to the right,exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
binded = $mainMod SHIFT $CONTROL, right,Move activewindow to the right,exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
binded = $mainMod SHIFT $CONTROL, up,Move activewindow to the right,exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
binded = $mainMod SHIFT $CONTROL, down,Move activewindow to the right,exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

# Enable moving windows between monitors with directional keys (Hyprland 0.54+)
binds {
    window_direction_monitor_fallback = true
}

# Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/Resize focused window
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

# Move/Switch to special workspace (scratchpad)
bind = $mainMod+Alt, S, movetoworkspacesilent, special
bind = $mainMod, S, togglespecialworkspace,

# Toggle focused window split
# bind = $mainMod, J, togglesplit

# Move focused window to a workspace silently
bind = $mainMod+Alt, 1, movetoworkspacesilent, 1
bind = $mainMod+Alt, 2, movetoworkspacesilent, 2
bind = $mainMod+Alt, 3, movetoworkspacesilent, 3
bind = $mainMod+Alt, 4, movetoworkspacesilent, 4
bind = $mainMod+Alt, 5, movetoworkspacesilent, 5
bind = $mainMod+Alt, 6, movetoworkspacesilent, 6
bind = $mainMod+Alt, 7, movetoworkspacesilent, 7
bind = $mainMod+Alt, 8, movetoworkspacesilent, 8
bind = $mainMod+Alt, 9, movetoworkspacesilent, 9
bind = $mainMod+Alt, 0, movetoworkspacesilent, 10


# Hyprspace Overview Controls
bindd = $mainMod SHIFT ALT, F12, Restore the desktop from before Dux, exec, kitty --hold ~/.local/share/bin/restore-pre-dux --apply
bindd = $mainMod ALT, F12, Start Dux Shell, exec, systemctl --user start dms.service
bindd = $mainMod, Y, Mission Control, hymission:toggle,
bindd = $mainMod SHIFT, Y, Mission Control on all workspaces, hymission:toggle, forceall
# bind = $mainMod, Y, overview:toggle         # Toggle on current monitor
#bind = $mainMod SHIFT, Y, overview:toggle,all  # Toggle on all monitors
#bind = $mainMod ALT, Y, overview:close      # Force close
#bind = SUPER, escape, overview:close        # Additional escape option
# s# # # # # # #

# notification center keybinds (swaync)
bind = $mainMod, N, exec, dms ipc call notifications toggle # toggle notifications
bind = $mainMod SHIFT, N, exec, dms ipc call notifications clearAll # clear notifications
bind = $mainMod CTRL, N, exec, dms ipc call notifications toggleDoNotDisturb # toggle do not disturb
bind = $mainMod ALT, N, exec, dms ipc call settings toggleWith notifications # notification settings

# Quick notification actions
bind = $mainMod, comma, exec, dms ipc call notifications dismiss # close latest notification
bind = $mainMod SHIFT, comma, exec, dms ipc call notifications clearAll # clear all notifications
